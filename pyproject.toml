[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "top-ten"
version = "0.1.0"
description = "Clean and analyse the UK top-ten singles"
readme = "README.md"
authors = [{ name = "Jay DesLauriers" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "lxml>=5.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.10", "mcp>=2,<3", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
